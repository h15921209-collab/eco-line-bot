name: 24H Render Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping after 15 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Pinging https://eco-line-assistant.onrender.com/health ..."
          curl -sS --max-time 15 https://eco-line-assistant.onrender.com/health || true
